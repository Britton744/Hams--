<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متجر همس - Hams Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* إعدادات عامة */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0d0614; color: #fff; display: flex; justify-content: center; min-height: 100vh; }
        
        /* محاكاة شاشة الجوال */
        .mobile-container { width: 100%; max-width: 430px; background-color: #0d0614; position: relative; overflow-x: hidden; box-shadow: 0 0 30px rgba(138, 43, 226, 0.15); display: flex; flex-direction: column; height: 100vh; }
        
        /* الألوان الجديدة */
        :root { 
            --purple: #8a2be2; 
            --pink: #ff69b4; 
            --blue: #00bfff; 
            --bg-dark: #1a0b2e; 
            --text-gray: #b0a8b9; 
            --border-color: #3a1c5a;
            --gradient-btn: linear-gradient(45deg, #8a2be2, #ff69b4);
        }
        
        /* الشريط العلوي */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(26, 11, 46, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .header-icons { display: flex; gap: 15px; font-size: 18px; color: var(--text-gray); }
        .logo-area { text-align: center; }
        .logo-area h1 { font-size: 18px; font-weight: 800; letter-spacing: 1px; background: var(--gradient-btn); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-area span { display: block; font-size: 10px; color: var(--pink); }

        /* المحتوى */
        .content { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        
        /* شريط التنقل السفلي */
        .bottom-nav { position: absolute; bottom: 0; width: 100%; background: rgba(26, 11, 46, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid var(--border-color); z-index: 100; }
        .bottom-nav a { color: var(--text-gray); display: flex; flex-direction: column; align-items: center; font-size: 11px; text-decoration: none; cursor: pointer; gap: 4px; transition: 0.3s; }
        .bottom-nav a.active { color: var(--pink); }
        .bottom-nav a:hover { color: var(--purple); }
        .bottom-nav i { font-size: 20px; }

        /* الصفحة الرئيسية */
        .hero { position: relative; height: 280px; background: url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=600&auto=format&fit=crop') center/cover; display: flex; flex-direction: column; justify-content: center; padding: 25px; }
        .hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, #0d0614, rgba(13, 6, 20, 0.4)); }
        .hero-content { position: relative; z-index: 1; margin-top: 50px; }
        .hero h2 { font-size: 28px; color: #fff; margin-bottom: 5px; text-shadow: 0 2px 10px rgba(138, 43, 226, 0.8); }
        .hero p { font-size: 14px; color: #e0d4f0; margin-bottom: 20px; line-height: 1.6; }
        .btn-shop { background: var(--gradient-btn); color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4); transition: 0.3s; }
        .btn-shop:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 105, 180, 0.6); }

        /* المميزات */
        .features { display: flex; justify-content: space-between; padding: 20px 15px; border-bottom: 1px solid var(--border-color); background: rgba(26, 11, 46, 0.5); }
        .feature { text-align: center; font-size: 10px; color: var(--text-gray); }
        .feature i { display: block; color: var(--blue); font-size: 20px; margin-bottom: 8px; }

        /* العروض */
        .promo-banner { margin: 20px 15px; background: linear-gradient(135deg, rgba(138,43,226,0.2), rgba(255,105,180,0.2)); border: 1px solid var(--purple); border-radius: 15px; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .promo-text h4 { font-size: 14px; color: #fff; margin-bottom: 5px; }
        .promo-text span { font-size: 28px; font-weight: bold; background: var(--gradient-btn); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* الأقسام */
        .section-title { padding: 15px 20px; font-size: 16px; font-weight: bold; display: flex; justify-content: space-between; color: #fff; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 15px; }
        .cat-card { background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; text-align: center; padding-bottom: 12px; transition: 0.3s; cursor: pointer; }
        .cat-card:hover { border-color: var(--pink); transform: translateY(-3px); }
        .cat-card img { width: 100%; height: 110px; object-fit: cover; }
        .cat-card p { font-size: 13px; margin-top: 10px; font-weight: bold; color: #e0d4f0; }

        /* شاشة المنتجات */
        .search-bar { margin: 15px; background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 25px; padding: 12px 20px; display: flex; align-items: center; gap: 10px; color: var(--text-gray); }
        .search-bar input { background: transparent; border: none; color: #fff; width: 100%; outline: none; font-family: inherit; }
        
        /* تفاصيل المنتج */
        .product-details { padding: 15px; }
        .main-img { width: 100%; height: 300px; object-fit: cover; border-radius: 15px; border: 1px solid var(--border-color); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .thumbnails { display: flex; gap: 10px; margin-top: 15px; }
        .thumbnails img { width: 65px; height: 65px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; }
        .thumbnails img.active { border-color: var(--pink); }
        .rating { color: var(--pink); font-size: 13px; margin: 12px 0; }
        .price-row { display: flex; align-items: center; gap: 12px; margin: 15px 0; }
        .price { font-size: 24px; font-weight: bold; color: var(--blue); }
        .old-price { font-size: 14px; text-decoration: line-through; color: var(--text-gray); }
        .discount { background: var(--gradient-btn); color: white; padding: 3px 8px; border-radius: 5px; font-size: 11px; }
        .qty-add { display: flex; gap: 15px; margin-top: 25px; }
        .qty { display: flex; align-items: center; background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 8px; }
        .qty button { background: none; border: none; color: #fff; padding: 10px 18px; cursor: pointer; font-size: 16px; }
        .qty span { padding: 0 10px; font-weight: bold; }
        .btn-add-cart { flex: 1; background: var(--gradient-btn); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3); }

        /* إتمام الطلب */
        .checkout-steps { display: flex; justify-content: space-between; margin: 25px 20px; position: relative; }
        .checkout-steps::before { content: ''; position: absolute; top: 15px; left: 10%; right: 10%; height: 2px; background: var(--border-color); z-index: 0; }
        .step { text-align: center; position: relative; z-index: 1; }
        .step-circle { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-dark); border: 2px solid var(--border-color); display: flex; align-items: center; justify-content: center; margin: 0 auto 6px; font-size: 12px; color: var(--text-gray); }
        .step.active .step-circle { background: var(--gradient-btn); border-color: transparent; color: #fff; box-shadow: 0 0 10px rgba(255,105,180,0.5); }
        .step p { font-size: 11px; color: var(--text-gray); }
        .step.active p { color: var(--pink); font-weight: bold; }

        .form-container { padding: 0 20px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 8px; color: #e0d4f0; }
        .form-group input { width: 100%; background: var(--bg-dark); border: 1px solid var(--border-color); padding: 14px; border-radius: 8px; color: #fff; font-family: inherit; outline: none; }
        .form-group input:focus { border-color: var(--blue); }
        
        .payment-box { background: var(--bg-dark); border: 1px solid var(--purple); border-radius: 10px; padding: 18px; margin-top: 25px; display: flex; align-items: center; gap: 12px; }
        
        .total-row { display: flex; justify-content: space-between; margin-top: 20px; font-weight: bold; font-size: 18px; color: #fff; }
        
        /* لوحة التحكم */
        .admin-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .stat-card { background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; text-align: right; position: relative; overflow: hidden; }
        .stat-card::before { content: ''; position: absolute; top: 0; right: 0; width: 4px; height: 100%; background: var(--gradient-btn); }
        .stat-card h3 { font-size: 22px; color: #fff; margin-bottom: 5px; }
        .stat-card p { font-size: 12px; color: var(--text-gray); }
        .stat-card i { color: var(--pink); font-size: 20px; margin-bottom: 10px; }
        
        .chart-box { margin: 0 20px 20px; background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; }
        .chart-line { height: 100px; border-bottom: 2px solid var(--border-color); position: relative; display: flex; align-items: flex-end; gap: 10px; padding-bottom: 5px; }
        .chart-line div { width: 10%; background: var(--gradient-btn); border-radius: 4px 4px 0 0; opacity: 0.8; }
        
        .admin-products { margin: 0 20px; }
        .admin-product-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--border-color); }
        .admin-product-row img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; border: 1px solid var(--purple); }
        .admin-product-row span { font-size: 13px; }

        /* إخفاء العناصر */
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="mobile-container">

    <!-- ================= [1] الشاشة الرئيسية ================= -->
    <div id="screen-home">
        <header class="header">
            <i class="fas fa-bars header-icons"></i>

                    <img src="https://images.unsplash.com/photo-1599839619722-39751411ea63?q=80&w=200&auto=format&fit=crop" alt="Lingerie">
                    <p>لانجيري وملابس</p>
                </div>
                <div class="cat-card" onclick="navTo('screen-products')">
                    <img src="https://images.unsplash.com/photo-1620916566398-39f1143ab7be?q=80&w=200&auto=format&fit=crop" alt="Toys">
                    <p>الألعاب الزوجية</p>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <a class="active" onclick="navTo('screen-home')"><i class="fas fa-home"></i>الرئيسية</a>
            <a onclick="navTo('screen-products')"><i class="fas fa-th-large"></i>الأقسام</a>
            <a onclick="navTo('screen-cart')"><i class="fas fa-shopping-bag"></i>السلة</a>
            <a onclick="navTo('screen-product-details')"><i class="fas fa-heart"></i>المفضلة</a>
            <a onclick="navTo('screen-admin')"><i class="fas fa-user"></
